# Compiles the plugin inside a throwaway Windows app. No device, so this proves
# the C++ builds, not that BLE works.
name: windows-build
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      # bash: pwsh drops the inner quotes and carries on past a failed step.
      - shell: bash
        run: |
          flutter create --platforms=windows --project-name probe ../probe
          cd ../probe
          flutter pub add 'flutter_blue_plus_winrt:{"path":"../flutter_blue_plus_winrt"}'
          grep flutter_blue_plus_winrt windows/flutter/generated_plugins.cmake
          flutter build windows --debug
